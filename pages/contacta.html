<h1>Contacta amb mi</h1>
<form class="form" action="#" method="post">

    <div>
        <label for="nom">Nom complet</label>
        <input class="nom" type="text" id="nom" name="nom" placeholder="Escriu el teu nom..."></input>
    </div>

    <div>
        <label for="email">Correu electrònic</label>
        <input class="correu" type="email" id="email" name="email" placeholder="nom@exemple.com..."></input>
    </div>

    <div>
        <label for="missatge">Asumpte</label>
        <textarea class="asumpte" id="Asumpte" name="email" placeholder="Motiu del missatge"></textarea>
    </div>

    <div>
        <label for="missatge">Missatge</label>
        <textarea class="missatge" id="missatge" name="email" placeholder="Escriu el teu missatge aqui"></textarea>
    </div>

    <div>
        <button type="submit" class="boto-enviar">Enviar missatge</button>
    </div>

</form>
